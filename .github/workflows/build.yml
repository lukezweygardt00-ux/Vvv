name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/build.gradle" ]; then
            project_root="$GITHUB_WORKSPACE"
          else
            mapfile -t archives < <(
              find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' \
                ! -path '*/.git/*' ! -path '*/.github/*' | sort -V
            )

            if [ "${#archives[@]}" -eq 0 ]; then
              echo "ERROR: No source ZIP found in repository."
              exit 1
            fi

            archive="${archives[${#archives[@]}-1]}"
            echo "Extracting: $archive"

            extract_dir="$RUNNER_TEMP/sitandwatch-source"
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"

            unzip -q -o "$archive" -d "$extract_dir"

            build_file="$(find "$extract_dir" -type f -name build.gradle -print -quit)"

            if [ -z "$build_file" ]; then
              echo "ERROR: build.gradle not found in ZIP."
              exit 1
            fi

            project_root="$(dirname "$build_file")"
          fi

          if [ ! -d "$project_root/src" ]; then
            echo "ERROR: src folder not found."
            exit 1
          fi

          echo "PROJECT_DIR=$project_root" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: sitandwatch-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
